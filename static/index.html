<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VM Chatbot</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* MAIN CHATBOT */
  .chatbot {
    width: 420px;
    height: 600px;
    background: #f8fafc;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  .chatbot-header {
    background: #eaf2ff;
    padding: 14px;
    font-weight: bold;
    font-size: 16px;
    text-align: center;
  }

  /* MESSAGES */
  .chatbot-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
  }

  .bot-msg {
    background: white;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    max-width: 85%;
    white-space: pre-wrap;   /* keeps formatting */
    line-height: 1.5;
  }

  .user-msg {
    background: #2563eb;
    color: white;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    max-width: 85%;
    margin-left: auto;
    white-space: pre-wrap;
  }

  /* INPUT */
  .chatbot-input {
    display: flex;
    padding: 12px;
    border-top: 1px solid #ddd;
    background: white;
  }

  .chatbot-input input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
  }

  .chatbot-input button {
    background: none;
    border: none;
    font-size: 18px;
    margin-left: 10px;
    cursor: pointer;
    color: #2563eb;
  }

  .footer {
    font-size: 11px;
    text-align: center;
    padding: 6px;
    color: #666;
  }
</style>
</head>

<body>

<!-- MAIN CHATBOT UI -->
<div class="chatbot">
  <div class="chatbot-header">VM-chatbot</div>

  <div id="messages" class="chatbot-messages">
    <div class="bot-msg">Hi 👋 How can I help you today?</div>
  </div>

  <div class="chatbot-input">
    <input id="question" placeholder="Ask me anything…" />
    <button onclick="ask()">▶</button>
  </div>

  <div class="footer">Built on VM-chatbot</div>
</div>

<script>
/* USER ID */
let userId = localStorage.getItem("user_id");
if (!userId) {
  userId = "user_" + Math.random().toString(36).substring(2, 10);
  localStorage.setItem("user_id", userId);
}

/* ASK FUNCTION */
async function ask() {
  const input = document.getElementById("question");
  const messages = document.getElementById("messages");

  const question = input.value.trim();
  if (!question) return;

  // USER MESSAGE
  const userDiv = document.createElement("div");
  userDiv.className = "user-msg";
  userDiv.textContent = question;
  messages.appendChild(userDiv);

  // BOT MESSAGE
  const botDiv = document.createElement("div");
  botDiv.className = "bot-msg";
  messages.appendChild(botDiv);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  const response = await fetch("/chatbot/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      user_id: userId,
      question: question
    })
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    botDiv.textContent += decoder.decode(value);
    messages.scrollTop = messages.scrollHeight;
  }
}
</script>

</body>
</html>
